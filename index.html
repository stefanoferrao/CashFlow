<!doctype html>
<html lang="pt-BR" data-theme-pref="system">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Chamadas à API, logos e imagens definem "no-referrer" individualmente. A política do documento envia no máximo
         a ORIGEM (nunca caminho/rota) — o widget Pluggy Connect precisa dela para concluir autorizações Open Finance/Meu Pluggy. -->
    <meta name="referrer" content="strict-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="CashFlow — veja em um só lugar onde está o seu dinheiro. Dados da Pluggy, processados somente no seu navegador." />
    <title>CashFlow</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Aplicativo instalado (PWA): Android, desktop e iOS -->
    <meta name="application-name" content="CashFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CashFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Aplica o tema antes da primeira pintura (evita "flash" do tema errado). Arquivo local, sem dados sensíveis. -->
    <script src="./theme-boot.js"></script>
    <!-- Sem JavaScript o app não abre: a tela de carregamento sairia da frente do aviso do <noscript>. -->
    <noscript><style>.splash{display:none!important}</style></noscript>
  </head>
  <body>
    <!-- Tela de carregamento: HTML puro para aparecer no primeiro quadro, antes de qualquer JavaScript.
         Estilos em src/styles/base.css; a saída (fade + remoção) fica em src/components/splash.ts. -->
    <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Carregando o CashFlow">
      <div class="splash__center">
        <div class="splash__mark" aria-hidden="true">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M5 16.5 10 11.5l3.5 3L19 8" stroke-width="2.4" /><circle cx="19" cy="8" r="1.8" fill="#22C55E" stroke="none" /></svg>
        </div>
        <div class="splash__name">CashFlow</div>
        <div class="splash__bar" aria-hidden="true"></div>
        <p class="splash__hint" id="splash-hint">Carregando suas finanças…</p>
      </div>
      <p class="splash__foot">Dados processados somente no seu navegador.</p>
    </div>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div id="app" aria-live="off"></div>
    <div id="toasts" class="toasts" role="region" aria-live="polite" aria-label="Notificações"></div>
    <div id="modal-root"></div>
    <noscript>O CashFlow precisa de JavaScript habilitado.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
